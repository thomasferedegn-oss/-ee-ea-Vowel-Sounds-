<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonics Fun! /ee/ & /ea/ Sounds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Baloo 2', cursive;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Custom animations for interactions */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-pop { animation: pop 0.3s ease-in-out; }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        
        .tab-btn.active {
            background-color: #fbbf24; /* amber-400 */
            color: #78350f; /* amber-900 */
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen text-gray-800 p-4 sm:p-8 flex flex-col items-center">

    <!-- Header -->
    <header class="text-center mb-8 max-w-4xl w-full">
        <h1 class="text-4xl sm:text-6xl font-extrabold text-emerald-600 drop-shadow-md mb-2">
            Phonics Fun! 🐝🍃
        </h1>
        <p class="text-xl sm:text-2xl text-emerald-800 font-semibold bg-white/70 inline-block px-6 py-2 rounded-full shadow-sm">
            Learn the long <span class="text-pink-600">/ee/</span> and <span class="text-blue-600">/ea/</span> sounds (የአማርኛ <span class="text-purple-600">/ኢ/</span> ድምፅ)
        </p>
    </header>

    <!-- Navigation -->
    <nav class="flex flex-wrap justify-center gap-3 sm:gap-4 mb-8 max-w-5xl w-full" id="nav-container">
        <!-- Buttons generated by JS -->
    </nav>

    <!-- Main Content Area -->
    <main id="app-container" class="w-full max-w-5xl bg-white rounded-3xl shadow-xl p-6 sm:p-10 min-h-[60vh] relative overflow-hidden border-4 border-emerald-200">
        <!-- Dynamic content goes here -->
    </main>

    <!-- Audio Helper -->
    <div class="hidden">
        <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8">
            <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
        </svg>
    </div>

<script>
    /* =========================================
       DATA SOURCE (From Provided Document)
       ========================================= */
    const phonicsData = [
        // PART 1: /ee/ Words
        { word: "bee", sound: "/ቢ/", amharic: "ንብ", example: "A small insect that makes honey", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "see", sound: "/ሲ/", amharic: "ማየት", example: "To look with your eyes", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "tree", sound: "/ትሪ/", amharic: "ዛፍ", example: "A tall plant with leaves", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "feet", sound: "/ፊት/", amharic: "እግሮች", example: "We walk on our two feet", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "seed", sound: "/ሲድ/", amharic: "ዘር", example: "Plant a seed in the soil", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "jeep", sound: "/ጂፕ/", amharic: "ጂፕ መኪና", example: "A strong off-road car", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "deep", sound: "/ዲፕ/", amharic: "ጥልቅ", example: "Far down under water", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "keep", sound: "/ኪፕ/", amharic: "መያዝ", example: "Keep your toys neat", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "sheep", sound: "/ሺፕ/", amharic: "በግ", example: "A woolly farm animal", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "green", sound: "/ግሪን/", amharic: "አረንጓዴ", example: "The color of grass", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "sleep", sound: "/ስሊፕ/", amharic: "መተኛት", example: "Go to sleep at night", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "sweet", sound: "/ስዊት/", amharic: "ጣፋጭ", example: "Candy tastes very sweet", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "wheel", sound: "/ዊል/", amharic: "መንኮራኩር", example: "A round wheel on a bus", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        { word: "queen", sound: "/ኩዊን/", amharic: "ንግሥት", example: "The ruler wearing a crown", vowel: "ee", imgColor: "fdf4ff", textColor: "d946ef" },
        
        // PART 2: /ea/ Words
        { word: "eat", sound: "/ኢት/", amharic: "መብላት", example: "Eat your healthy food", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "tea", sound: "/ቲ/", amharic: "ሻይ", example: "A warm cup of tea", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "sea", sound: "/ሲ/", amharic: "ባሕር", example: "Big blue ocean water", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "pea", sound: "/ፒ/", amharic: "አተር", example: "A tiny round green vegetable", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "ear", sound: "/ኢር/", amharic: "ጆሮ", example: "We hear with our ear", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "read", sound: "/ሪድ/", amharic: "ማንበብ", example: "Read a fun storybook", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "leaf", sound: "/ሊፍ/", amharic: "ቅጠል", example: "A green leaf on a branch", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "meat", sound: "/ሚት/", amharic: "ሥጋ", example: "Food from animals", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "seat", sound: "/ሲት/", amharic: "መቀመጫ", example: "Sit down on your seat", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "bean", sound: "/ቢን/", amharic: "ባቄላ", example: "A healthy brown or green bean", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "seal", sound: "/ሲል/", amharic: "አሳማ ባሕር", example: "An animal that swims in the sea", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "team", sound: "/ቲም/", amharic: "ቡድን", example: "Play together as a team", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "beak", sound: "/ቢክ/", amharic: "የወፍ ምንቃር", example: "A bird eats with its beak", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "clean", sound: "/ክሊን/", amharic: "ንጹሕ", example: "Wash hands to stay clean", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" },
        { word: "peach", sound: "/ፒች/", amharic: "ኮክ", example: "A soft, juicy sweet fruit", vowel: "ea", imgColor: "f0f9ff", textColor: "0284c7" }
    ];

    /* =========================================
       AUDIO CONFIGURATION (Web Speech API)
       ========================================= */
    let synth = window.speechSynthesis;
    let preferredVoice = null;

    function initVoices() {
        const voices = synth.getVoices();
        if (voices.length === 0) return;
        
        // Find Female UK English Voice
        preferredVoice = voices.find(v => v.lang.startsWith('en-GB') && (v.name.includes('Female') || v.name.includes('Google UK English Female'))) 
                         || voices.find(v => v.lang.startsWith('en-GB')) 
                         || voices.find(v => v.lang.startsWith('en')) 
                         || voices[0];
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initVoices;
    }
    initVoices(); // Initial call just in case voices are already loaded

    function playAudio(text, callback) {
        if (synth.speaking) {
            synth.cancel();
        }
        const utterance = new SpeechSynthesisUtterance(text);
        if (preferredVoice) utterance.voice = preferredVoice;
        utterance.rate = 0.85; // Slower for kids
        utterance.pitch = 1.1; // Slightly higher, friendlier pitch
        
        if(callback) {
            utterance.onend = callback;
        }
        synth.speak(utterance);
    }

    // Generate placeholder image URL
    function getImgUrl(wordObj) {
        // In a real app, you'd replace this with actual hosted image URLs
        return `https://placehold.co/400x400/${wordObj.imgColor}/${wordObj.textColor}?text=${wordObj.word}`;
    }

    /* =========================================
       APP STATE & ROUTING
       ========================================= */
    const MODES = [
        { id: 'flashcards', name: '📚 Flashcards', color: 'bg-pink-100 hover:bg-pink-200 text-pink-700' },
        { id: 'listen_match', name: '🎧 Listen & Match', color: 'bg-blue-100 hover:bg-blue-200 text-blue-700' },
        { id: 'fill_blanks', name: '✍️ Fill in the Blanks', color: 'bg-purple-100 hover:bg-purple-200 text-purple-700' },
        { id: 'match_amharic', name: '🇪🇹 Match Amharic', color: 'bg-orange-100 hover:bg-orange-200 text-orange-700' }
    ];

    let currentMode = 'flashcards';
    const appContainer = document.getElementById('app-container');
    const navContainer = document.getElementById('nav-container');

    function renderNav() {
        navContainer.innerHTML = '';
        MODES.forEach(mode => {
            const btn = document.createElement('button');
            btn.className = `tab-btn px-6 py-3 rounded-2xl font-bold text-lg transition-all duration-200 border-2 border-transparent ${mode.color} ${currentMode === mode.id ? 'active border-yellow-500' : ''}`;
            btn.textContent = mode.name;
            btn.onclick = () => {
                currentMode = mode.id;
                renderNav();
                loadCurrentMode();
            };
            navContainer.appendChild(btn);
        });
    }

    function loadCurrentMode() {
        appContainer.innerHTML = '';
        appContainer.className = "w-full max-w-5xl bg-white rounded-3xl shadow-xl p-6 sm:p-10 min-h-[60vh] relative overflow-hidden border-4 border-emerald-200 transition-all duration-500";
        if (synth.speaking) synth.cancel(); // Stop audio on tab change
        
        switch (currentMode) {
            case 'flashcards': renderFlashcards(); break;
            case 'listen_match': renderListenMatch(); break;
            case 'fill_blanks': renderFillBlanks(); break;
            case 'match_amharic': renderAmharicMatch(); break;
        }
    }

    // Helper: Shuffle Array
    function shuffleArray(array) {
        return array.slice().sort(() => Math.random() - 0.5);
    }

    // Get a random integer
    function getRandomInt(max) {
        return Math.floor(Math.random() * max);
    }

    /* =========================================
       MODE 1: INTERACTIVE FLASHCARDS
       ========================================= */
    function renderFlashcards() {
        const title = document.createElement('h2');
        title.className = 'text-3xl font-bold text-center text-emerald-700 mb-8';
        title.textContent = 'Explore the Words!';
        
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';

        phonicsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-gray-50 rounded-2xl p-4 shadow-md hover:shadow-xl transition-shadow border-2 border-gray-100 flex flex-col items-center text-center cursor-pointer hover:border-emerald-300';
            
            card.innerHTML = `
                <img src="${getImgUrl(item)}" alt="${item.word}" class="w-full h-40 object-cover rounded-xl mb-4 bg-white border border-gray-200">
                <div class="flex items-center gap-2 mb-2">
                    <h3 class="text-3xl font-extrabold capitalize text-gray-800">${item.word}</h3>
                    <button class="text-emerald-500 hover:text-emerald-700 transition-colors p-2 bg-emerald-100 rounded-full audio-btn" data-word="${item.word}">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" /></svg>
                    </button>
                </div>
                <p class="text-lg font-bold text-purple-600">${item.amharic} <span class="text-gray-500 text-sm font-normal">(${item.sound})</span></p>
                <p class="text-sm text-gray-600 mt-2 italic">"${item.example}"</p>
                <div class="mt-3 px-3 py-1 rounded-full text-xs font-bold uppercase ${item.vowel === 'ee' ? 'bg-pink-100 text-pink-700' : 'bg-blue-100 text-blue-700'}">
                    Vowel: ${item.vowel}
                </div>
            `;
            
            // Audio play logic
            const btn = card.querySelector('.audio-btn');
            btn.onclick = (e) => {
                e.stopPropagation();
                playAudio(item.word);
                btn.classList.add('animate-pop');
                setTimeout(() => btn.classList.remove('animate-pop'), 300);
            };

            card.onclick = () => {
                playAudio(item.word);
                card.classList.add('animate-pop');
                setTimeout(() => card.classList.remove('animate-pop'), 300);
            };
            
            grid.appendChild(card);
        });

        appContainer.appendChild(title);
        appContainer.appendChild(grid);
    }

    /* =========================================
       MODE 2: LISTEN & MATCH
       ========================================= */
    let lm_targetWord = null;
    function renderListenMatch() {
        const title = document.createElement('h2');
        title.className = 'text-3xl font-bold text-center text-blue-700 mb-4';
        title.textContent = 'Listen & Match the Image';

        const instr = document.createElement('p');
        instr.className = 'text-center text-gray-600 mb-8 text-lg';
        instr.textContent = 'Click the big play button, then choose the right picture!';

        const playArea = document.createElement('div');
        playArea.className = 'flex flex-col items-center w-full';

        // Select target and options
        const shuffledData = shuffleArray(phonicsData);
        lm_targetWord = shuffledData[0];
        const options = shuffleArray([lm_targetWord, shuffledData[1], shuffledData[2]]);

        const bigPlayBtn = document.createElement('button');
        bigPlayBtn.className = 'w-32 h-32 bg-blue-500 hover:bg-blue-600 text-white rounded-full flex justify-center items-center shadow-lg shadow-blue-500/50 mb-10 transition-transform hover:scale-105 active:scale-95';
        bigPlayBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16 ml-2"><path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" /></svg>';
        
        bigPlayBtn.onclick = () => {
            playAudio(lm_targetWord.word);
            bigPlayBtn.classList.add('animate-pop');
            setTimeout(() => bigPlayBtn.classList.remove('animate-pop'), 300);
        };

        const optionsContainer = document.createElement('div');
        optionsContainer.className = 'grid grid-cols-1 sm:grid-cols-3 gap-6 w-full max-w-4xl';

        let answered = false;

        options.forEach(opt => {
            const optCard = document.createElement('div');
            optCard.className = 'bg-white border-4 border-gray-200 rounded-3xl p-4 cursor-pointer hover:border-blue-300 hover:shadow-lg transition-all text-center';
            optCard.innerHTML = `<img src="${getImgUrl(opt)}" alt="option" class="w-full h-48 object-cover rounded-xl pointer-events-none">`;
            
            optCard.onclick = () => {
                if(answered) return;
                
                if (opt.word === lm_targetWord.word) {
                    answered = true;
                    optCard.classList.remove('border-gray-200', 'hover:border-blue-300');
                    optCard.classList.add('border-green-500', 'bg-green-50', 'animate-pop');
                    playAudio("Correct! " + lm_targetWord.word);
                    showNextButton(playArea, renderListenMatch);
                } else {
                    optCard.classList.remove('border-gray-200');
                    optCard.classList.add('border-red-400', 'animate-shake');
                    setTimeout(() => {
                        if(!answered){
                           optCard.classList.remove('border-red-400', 'animate-shake');
                           optCard.classList.add('border-gray-200');
                        }
                    }, 800);
                }
            };
            optionsContainer.appendChild(optCard);
        });

        playArea.appendChild(bigPlayBtn);
        playArea.appendChild(optionsContainer);
        
        appContainer.appendChild(title);
        appContainer.appendChild(instr);
        appContainer.appendChild(playArea);

        // Auto play question on load
        setTimeout(() => bigPlayBtn.click(), 500);
    }

    /* =========================================
       MODE 3: FILL IN THE BLANKS
       ========================================= */
    function renderFillBlanks() {
        const title = document.createElement('h2');
        title.className = 'text-3xl font-bold text-center text-purple-700 mb-8';
        title.textContent = 'Click the Correct Phoneme';

        const shuffledData = shuffleArray(phonicsData);
        const targetWord = shuffledData[0];
        
        const playArea = document.createElement('div');
        playArea.className = 'flex flex-col items-center w-full max-w-2xl mx-auto';

        // Display Image and Amharic Hint
        const hintCard = document.createElement('div');
        hintCard.className = 'bg-purple-50 p-6 rounded-3xl flex flex-col sm:flex-row items-center gap-6 mb-8 w-full shadow-inner';
        hintCard.innerHTML = `
            <img src="${getImgUrl(targetWord)}" alt="hint" class="w-40 h-40 object-cover rounded-2xl shadow-sm border-2 border-white">
            <div class="text-center sm:text-left">
                <h3 class="text-2xl font-bold text-gray-800 mb-2">Meaning: ${targetWord.amharic}</h3>
                <p class="text-gray-600 text-lg">Amharic Sound: <span class="font-bold text-purple-600">${targetWord.sound}</span></p>
                <button class="mt-4 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-full font-bold shadow-md flex items-center gap-2 transition-transform active:scale-95 mx-auto sm:mx-0" id="fb-audio-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" /></svg>
                    Listen to Word
                </button>
            </div>
        `;

        const wordDisplay = document.createElement('div');
        wordDisplay.className = 'text-6xl font-extrabold tracking-widest text-gray-800 mb-10 flex gap-2';
        
        // Split word into parts based on 'ee' or 'ea'
        const parts = targetWord.word.split(targetWord.vowel);
        const prefix = parts[0];
        const suffix = parts[1] || ''; // handle case if vowel is at the end

        const prefixSpan = document.createElement('span'); prefixSpan.textContent = prefix;
        const blankSpan = document.createElement('span'); 
        blankSpan.className = 'text-gray-300 border-b-8 border-gray-300 min-w-[80px] text-center inline-block transition-colors';
        blankSpan.textContent = '_ _';
        const suffixSpan = document.createElement('span'); suffixSpan.textContent = suffix;
        
        wordDisplay.appendChild(prefixSpan);
        wordDisplay.appendChild(blankSpan);
        wordDisplay.appendChild(suffixSpan);

        const optionsArea = document.createElement('div');
        optionsArea.className = 'flex gap-6';

        const optEE = document.createElement('button');
        optEE.className = 'text-4xl font-extrabold bg-pink-100 text-pink-700 px-8 py-4 rounded-2xl hover:bg-pink-200 hover:scale-105 active:scale-95 transition-all shadow-sm border-2 border-pink-300';
        optEE.textContent = 'ee';

        const optEA = document.createElement('button');
        optEA.className = 'text-4xl font-extrabold bg-blue-100 text-blue-700 px-8 py-4 rounded-2xl hover:bg-blue-200 hover:scale-105 active:scale-95 transition-all shadow-sm border-2 border-blue-300';
        optEA.textContent = 'ea';
        
        let answered = false;

        const handleGuess = (guess, btn) => {
            if (answered) return;
            if (guess === targetWord.vowel) {
                answered = true;
                blankSpan.textContent = guess;
                blankSpan.classList.remove('text-gray-300', 'border-gray-300');
                blankSpan.classList.add('text-green-500', 'border-green-500', 'animate-pop');
                btn.classList.add('bg-green-500', 'text-white', 'border-green-600');
                
                playAudio(targetWord.word);
                showNextButton(playArea, renderFillBlanks);
            } else {
                btn.classList.add('animate-shake', 'bg-red-100', 'text-red-700', 'border-red-400');
                setTimeout(() => {
                    btn.classList.remove('animate-shake', 'bg-red-100', 'text-red-700', 'border-red-400');
                }, 800);
            }
        };

        optEE.onclick = () => handleGuess('ee', optEE);
        optEA.onclick = () => handleGuess('ea', optEA);

        optionsArea.appendChild(optEE);
        optionsArea.appendChild(optEA);
        
        playArea.appendChild(hintCard);
        playArea.appendChild(wordDisplay);
        playArea.appendChild(optionsArea);

        appContainer.appendChild(title);
        appContainer.appendChild(playArea);

        // Bind audio
        setTimeout(() => {
            const btn = document.getElementById('fb-audio-btn');
            if(btn) {
                btn.onclick = () => playAudio(targetWord.word);
            }
        }, 0);
    }

    /* =========================================
       MODE 4: AMHARIC MATCHING
       ========================================= */
    function renderAmharicMatch() {
        const title = document.createElement('h2');
        title.className = 'text-3xl font-bold text-center text-orange-700 mb-2';
        title.textContent = 'Match English to Amharic!';
        
        const instr = document.createElement('p');
        instr.className = 'text-center text-gray-600 mb-8 text-lg';
        instr.textContent = 'Click an English word, then click its Amharic meaning.';

        const playArea = document.createElement('div');
        playArea.className = 'flex flex-col md:flex-row justify-center gap-8 w-full max-w-4xl mx-auto';

        // Select 5 random words
        const gameWords = shuffleArray(phonicsData).slice(0, 5);
        
        const englishCol = document.createElement('div');
        englishCol.className = 'flex flex-col gap-4 w-full md:w-1/2';
        
        const amharicCol = document.createElement('div');
        amharicCol.className = 'flex flex-col gap-4 w-full md:w-1/2';

        const enList = shuffleArray([...gameWords]);
        const amList = shuffleArray([...gameWords]);

        let selectedEn = null;
        let selectedAm = null;
        let matchesFound = 0;

        const checkMatch = () => {
            if (selectedEn && selectedAm) {
                const enWord = selectedEn.dataset.word;
                const amWord = selectedAm.dataset.word;

                if (enWord === amWord) {
                    // Match found!
                    selectedEn.classList.remove('bg-yellow-100', 'border-yellow-400');
                    selectedAm.classList.remove('bg-yellow-100', 'border-yellow-400');
                    
                    selectedEn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'animate-pop');
                    selectedAm.classList.add('bg-green-500', 'text-white', 'border-green-600', 'animate-pop');
                    
                    selectedEn.disabled = true;
                    selectedAm.disabled = true;

                    playAudio("Good job! " + enWord);

                    selectedEn = null;
                    selectedAm = null;
                    matchesFound++;

                    if (matchesFound === 5) {
                        setTimeout(() => showNextButton(appContainer, renderAmharicMatch, "Play Again!"), 1000);
                    }
                } else {
                    // Wrong match
                    selectedEn.classList.add('animate-shake', 'bg-red-100', 'border-red-400');
                    selectedAm.classList.add('animate-shake', 'bg-red-100', 'border-red-400');
                    
                    const tempEn = selectedEn;
                    const tempAm = selectedAm;
                    
                    setTimeout(() => {
                        tempEn.classList.remove('animate-shake', 'bg-red-100', 'border-red-400', 'bg-yellow-100');
                        tempAm.classList.remove('animate-shake', 'bg-red-100', 'border-red-400', 'bg-yellow-100');
                        tempEn.classList.add('bg-white');
                        tempAm.classList.add('bg-white');
                    }, 800);

                    selectedEn = null;
                    selectedAm = null;
                }
            }
        };

        enList.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'en-btn px-6 py-4 bg-white border-2 border-gray-300 rounded-xl text-xl font-bold text-gray-700 hover:border-orange-400 transition-all flex justify-between items-center';
            btn.dataset.word = item.word;
            
            btn.innerHTML = `
                <span>${item.word}</span>
                <span class="text-sm bg-gray-100 px-2 py-1 rounded text-gray-500 audio-hint" data-word="${item.word}">🔊</span>
            `;

            btn.onclick = (e) => {
                if (btn.disabled) return;
                
                // If clicked on audio hint
                if(e.target.classList.contains('audio-hint')){
                    playAudio(item.word);
                    e.stopPropagation();
                    return;
                }
                
                // Deselect current if any
                document.querySelectorAll('.en-btn').forEach(b => {
                    if (!b.disabled) { b.classList.remove('bg-yellow-100', 'border-yellow-400'); b.classList.add('bg-white'); }
                });

                selectedEn = btn;
                btn.classList.remove('bg-white');
                btn.classList.add('bg-yellow-100', 'border-yellow-400');
                playAudio(item.word);
                checkMatch();
            };
            englishCol.appendChild(btn);
        });

        amList.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'am-btn px-6 py-4 bg-white border-2 border-gray-300 rounded-xl text-xl font-bold text-gray-700 hover:border-orange-400 transition-all text-left';
            btn.dataset.word = item.word;
            btn.innerHTML = `${item.amharic} <span class="block text-sm font-normal text-purple-500">${item.sound}</span>`;

            btn.onclick = () => {
                if (btn.disabled) return;
                
                document.querySelectorAll('.am-btn').forEach(b => {
                    if (!b.disabled) { b.classList.remove('bg-yellow-100', 'border-yellow-400'); b.classList.add('bg-white'); }
                });

                selectedAm = btn;
                btn.classList.remove('bg-white');
                btn.classList.add('bg-yellow-100', 'border-yellow-400');
                checkMatch();
            };
            amharicCol.appendChild(btn);
        });

        playArea.appendChild(englishCol);
        playArea.appendChild(amharicCol);

        appContainer.appendChild(title);
        appContainer.appendChild(instr);
        appContainer.appendChild(playArea);
    }

    /* =========================================
       UTILITIES
       ========================================= */
    function showNextButton(container, callback, text = "Next Question! 🌟") {
        // Remove existing next button if present
        const existingBtn = document.getElementById('next-btn');
        if(existingBtn) existingBtn.remove();

        const wrapper = document.createElement('div');
        wrapper.className = 'w-full flex justify-center mt-10';
        wrapper.id = 'next-btn';

        const btn = document.createElement('button');
        btn.className = 'bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-2xl font-extrabold px-10 py-4 rounded-full shadow-[0_5px_0_#b45309] active:shadow-[0_0px_0_#b45309] active:translate-y-[5px] transition-all animate-bounce';
        btn.textContent = text;
        btn.onclick = () => {
            wrapper.remove();
            callback();
        };

        wrapper.appendChild(btn);
        container.appendChild(wrapper);
    }

    // Initialize App
    window.onload = () => {
        renderNav();
        loadCurrentMode();
    };

</script>
</body>
</html>
